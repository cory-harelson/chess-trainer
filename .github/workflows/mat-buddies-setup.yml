name: Mat Buddies storage
on: workflow_dispatch
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create shared storage if needed, check it works from a browser origin
        run: |
          set -e
          if grep -q "__BLOB_ID__" mat-buddies/index.html; then
            HDRS=$(curl -sS -D - -o body.txt -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
              -d '{"roster":[{"id":"max","name":"Max"},{"id":"moose","name":"Moose"},{"id":"jacob","name":"Jacob"}],"weeks":{}}' \
              https://jsonblob.com/api/jsonBlob)
            echo "$HDRS"
            ID=$(echo "$HDRS" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | sed 's#.*/##')
          else
            ID=$(grep -o 'jsonBlob/[A-Za-z0-9-]*' mat-buddies/index.html | head -1 | sed 's#.*/##')
          fi
          echo "BLOB_ID=$ID"
          test -n "$ID"
          echo "--- GET"; curl -sS https://jsonblob.com/api/jsonBlob/$ID; echo
          echo "--- CORS preflight"
          curl -sS -i -X OPTIONS -H 'Origin: https://cory-harelson.github.io' -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: content-type,accept' https://jsonblob.com/api/jsonBlob/$ID | grep -i -E '^HTTP|access-control' || true
          echo "--- CORS on GET"
          curl -sS -i -H 'Origin: https://cory-harelson.github.io' https://jsonblob.com/api/jsonBlob/$ID | grep -i -E '^HTTP|access-control' || true
      - name: Check the live page
        run: |
          curl -sS -o page.html -w 'live page HTTP %{http_code}\n' https://cory-harelson.github.io/chess-trainer/mat-buddies/ || true
          grep -o 'jsonBlob/[A-Za-z0-9_-]*' page.html | head -1 || echo "no store id on live page yet"
