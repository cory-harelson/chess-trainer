name: Mat Buddies storage
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ntfy
        run: |
          O='Origin: https://cory-harelson.github.io'
          T=matbuddies-probe-$RANDOM$RANDOM
          curl -sS -D - -o pub.txt -H "$O" -H 'Content-Type: text/plain' -d '{"t":"set","week":"2026-11-23","kid":"max","day":"tue","f":"a","v":true}' https://ntfy.sh/$T | grep -i -E '^HTTP|access-control'
          cat pub.txt; echo
          sleep 2
          curl -sS -D - -H "$O" "https://ntfy.sh/$T/json?poll=1&since=all" | grep -i -E '^HTTP|access-control|^\{'
